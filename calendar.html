<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活動月曆（酒＋巧克力）</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="韋・活動月曆">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F3EE; --surface:#FFFFFF; --surface-2:#EDE6DD;
  --ink:#2A1D12; --ink-2:#6B5847; --ink-3:#9A8875;
  --line:#DED3C6; --line-strong:#C8BBAA;
  --accent:#7A4A1E; --on-accent:#FFFFFF;
  --add:#0B6F55; --add-bg:#DFF1EA; --swap:#9A5C00; --swap-bg:#FBEDD5; --drop:#A32F44; --drop-bg:#FAE3E7;
  --r-lg:14px; --r-md:11px;
  --sh-2:0 1px 2px rgba(26,17,10,.05),0 14px 34px -22px rgba(26,17,10,.85);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#150E09; --surface:#1E140C; --surface-2:#261A10;
  --ink:#F1E6D8; --ink-2:#BCAB96; --ink-3:#8A7660;
  --line:#33251A; --line-strong:#463322;
  --accent:#E0B37A; --on-accent:#150E09;
  --add:#4FC0A0; --add-bg:#123028; --swap:#E0A548; --swap-bg:#332512; --drop:#EC8496; --drop-bg:#361A20;
  --sh-2:0 1px 2px rgba(0,0,0,.45),0 14px 34px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#150E09; --surface:#1E140C; --surface-2:#261A10;
  --ink:#F1E6D8; --ink-2:#BCAB96; --ink-3:#8A7660;
  --line:#33251A; --line-strong:#463322;
  --accent:#E0B37A; --on-accent:#150E09;
  --add:#4FC0A0; --add-bg:#123028; --swap:#E0A548; --swap-bg:#332512; --drop:#EC8496; --drop-bg:#361A20;
  --sh-2:0 1px 2px rgba(0,0,0,.45),0 14px 34px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:4px 16px 60px}
@media(min-width:720px){.wrap{padding:8px 24px 72px}}
</style>
<script defer src="https://xsos32-design.github.io/dutyliquorwiki/nav.js"></script>
</head>
<body>
<div class="wrap">

<section id="view-cal">
  <div class="cal-head"><div><h2><span>活動月曆（酒＋巧克力）</span></h2>
  <p>酒和巧克力的活動合在同一份。選月份，每一檔的期間用色條畫在日期上；點活動名稱可以只看那一檔。</p></div><div class="cal-cat" role="group" aria-label="類別"><button type="button" class="on" data-cat="all">全部</button><button type="button" data-cat="wine">酒</button><button type="button" data-cat="choc">巧克力</button></div></div>
  <div class="cal-nav">
    <button type="button" class="cal-btn" data-m="-1" aria-label="上個月">‹</button>
    <b id="cal-title">—</b>
    <button type="button" class="cal-btn" data-m="1" aria-label="下個月">›</button>
    <button type="button" class="cal-btn cal-today" data-m="0">今天</button>
  </div>
  <div class="cal-grid" id="cal-grid" role="grid"></div>
  <ol class="cal-legend" id="cal-legend"></ol>
  <p class="cal-foot">日期以你手機／電腦當下的日期為準；「送完為止」的檔沒有結束日，色條一路畫到月底。實際折抵與贈品發放以 POS 與現場公告為準。</p>
</section>

</div>

<style id="cal-css">
:root{--cal-blue:#2B5C8A;--cal-blue-bg:#DDE9F5;--cal-purple:#6B4C9A;--cal-brown:#8A5A2B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cal-blue:#7FB3E6;--cal-blue-bg:#16283A;--cal-purple:#B9A2E6;--cal-brown:#D9A66E}}
:root[data-theme="dark"]{--cal-blue:#7FB3E6;--cal-blue-bg:#16283A;--cal-purple:#B9A2E6;--cal-brown:#D9A66E}
#view-cal{padding-bottom:20px}
.cal-head{margin:18px 0 0;padding:15px 16px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg,14px);box-shadow:var(--sh-2);position:relative;overflow:hidden}
.cal-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.cal-head h2{font-family:"Noto Serif TC",serif;font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
.cal-head h2 .ic{width:1.05em;height:1.05em;color:var(--accent)}
.cal-head p{margin:4px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink-2);max-width:52ch}
.cal-nav{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.cal-nav b{flex:1;text-align:center;font-family:"Noto Serif TC",serif;font-size:18px;letter-spacing:.02em}
.cal-btn{appearance:none;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);border-radius:999px;width:38px;height:36px;font-size:20px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center}
.cal-btn.cal-today{width:auto;padding:0 12px;font-size:12.5px;font-family:inherit}
.cal-btn:active{transform:scale(.95)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md,11px);overflow:hidden}
.cal-dow{padding:7px 0 6px;text-align:center;font-size:11px;letter-spacing:.06em;color:var(--ink-3);
  border-bottom:1px solid var(--line);background:var(--surface-2)}
.cal-dow.we{color:var(--drop)}
.cal-d{position:relative;min-height:64px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:4px 0 5px}
.cal-d:nth-child(7n){border-right:0}
.cal-d.out{background:var(--surface-2);opacity:.45}
.cal-d.past .n{color:var(--ink-3)}
.cal-d .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  margin:0 0 3px 4px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;border-radius:999px;color:var(--ink)}
.cal-d.we .n{color:var(--drop)}
.cal-d.today .n{background:var(--ink);color:var(--bg);font-weight:600}
.cal-lane{height:7px;margin:0 0 2px;opacity:0}
.cal-lane.on{opacity:.82}
.cal-lane.s{border-radius:4px 0 0 4px;margin-left:3px}
.cal-lane.e{border-radius:0 4px 4px 0;margin-right:3px}
.cal-lane.s.e{border-radius:4px}
.c-drop{background:var(--drop)} .c-add{background:var(--add)} .c-swap{background:var(--swap)}
.c-accent{background:var(--accent)} .c-blue{background:var(--cal-blue)} .c-purple{background:var(--cal-purple)} .c-brown{background:var(--cal-brown)}
.cal-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.cal-cat{display:inline-flex;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px}
.cal-cat button{appearance:none;border:0;background:transparent;color:var(--ink-2);font-family:inherit;font-size:12.5px;
  padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:500}
.cal-cat button.on{background:var(--accent);color:var(--on-accent)}
.cal-legend .ct{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line-strong);
  color:var(--ink-3);margin-right:6px;vertical-align:1px;font-weight:500}
body.cal-solo .cal-lane.on:not(.pick){opacity:.12}
.cal-legend{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:7px}
.cal-legend li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;
  padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md,11px);
  cursor:pointer;user-select:none;transition:opacity .15s,border-color .15s}
.cal-legend li.pick{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
body.cal-solo .cal-legend li:not(.pick){opacity:.5}
.cal-legend .sw{width:14px;height:14px;border-radius:4px;margin-top:3px}
.cal-legend b{display:block;font-size:14px;line-height:1.45}
.cal-legend .rg{display:block;margin-top:2px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.cal-legend .rg u{text-decoration:none;padding:0 .1em;border-radius:2px;font-weight:500;color:var(--ink);
  background-image:linear-gradient(transparent 52%,rgba(196,140,46,.34) 52%,rgba(196,140,46,.34) 96%,transparent 96%);
  background-image:linear-gradient(transparent 52%,color-mix(in srgb,var(--mk) 32%,transparent) 52%,color-mix(in srgb,var(--mk) 32%,transparent) 96%,transparent 96%)}
.cal-legend li{--mk:#C48C2E}
.cal-legend li.m-drop{--mk:var(--drop)} .cal-legend li.m-add{--mk:var(--add)} .cal-legend li.m-swap{--mk:var(--swap)}
.cal-legend li.m-blue{--mk:var(--cal-blue)} .cal-legend li.m-purple{--mk:var(--cal-purple)} .cal-legend li.m-brown{--mk:var(--cal-brown)}
.cal-legend .sb{display:block;margin-top:1px;font-size:11.5px;color:var(--ink-3)}
.cal-legend .st{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap;font-weight:500}
.cal-legend .st.on{color:var(--add);background:var(--add-bg);border-color:var(--add)}
.cal-legend .st.gap{color:var(--swap);background:var(--swap-bg);border-color:var(--swap)}
.cal-legend .st.soon{color:var(--ink-2);background:var(--surface-2);border-color:var(--line-strong)}
.cal-legend .st.over{color:var(--ink-3);background:var(--surface-2);border-color:var(--line);text-decoration:line-through}
.cal-legend li.over{opacity:.55}
.cal-empty{padding:14px;text-align:center;color:var(--ink-3);font-size:13px;border:1px dashed var(--line-strong);border-radius:var(--r-md,11px)}
.cal-foot{margin:14px 0 0;font-size:11.5px;line-height:1.75;color:var(--ink-3)}
@media(min-width:720px){.cal-d{min-height:82px}.cal-lane{height:8px}.cal-legend{grid-template-columns:1fr 1fr}}
@media print{#view-cal{display:none!important}}
</style>

<script id="cal-js">
(function(){
  var CAL=[{"k": "bag", "cat": "choc", "n": "折扣後滿 $4,000 贈透明旅行袋", "s": "三段，中間沒有", "c": "drop", "r": [["2026-09-24", "2026-09-28"], ["2026-10-02", "2026-10-11"], ["2026-10-23", "2026-10-26"]]}, {"k": "d150", "cat": "choc", "n": "國產食品＆巧克力 滿 $2,000 折 $150", "s": "整段都有", "c": "add", "r": [["2026-09-22", "2026-10-31"]]}, {"k": "gift", "cat": "choc", "n": "不限金額 送會員禮小燈箱", "s": "送完為止", "c": "blue", "r": [["2026-09-22", null]]}, {"k": "noodle", "cat": "both", "n": "泡麵：酒 滿 2 件／巧克力折扣後滿 $1,500 → 贈 2 杯", "s": "送完為止・各大類分開算，樂高不併計", "c": "swap", "r": [["2026-09-24", null]]}, {"k": "amt", "cat": "wine", "n": "酒類全店滿額（$8,000／$18,800／單瓶 $20,000）", "s": "9 月整月・要 key 活動代碼 A7", "c": "purple", "r": [["2026-09-01", "2026-09-30"]]}, {"k": "tier", "cat": "both", "n": "9 月促銷表折扣級距（酒＋巧克力）", "s": "整月", "c": "brown", "r": [["2026-09-01", "2026-09-30"]]}];
  var grid=document.getElementById('cal-grid'), leg=document.getElementById('cal-legend'),
      title=document.getElementById('cal-title'), sec=document.getElementById('view-cal');
  if(!grid||!sec) return;
  function D(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function md(s){ return s.slice(5).replace('-','/'); }
  function today(){ var t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
  var cur=today(); cur=new Date(cur.getFullYear(),cur.getMonth(),1);
  var pick=null, cat='all';
  var CATN={"choc": "巧克力", "wine": "酒", "both": "酒＋巧克力"};
  function inRange(c,d){ for(var i=0;i<c.r.length;i++){ var a=D(c.r[i][0]), b=c.r[i][1]?D(c.r[i][1]):null;
      if(d>=a && (!b||d<=b)) return c.r[i]; } return null; }
  function status(c,t){
    var on=inRange(c,t); if(on) return ['on','進行中'];
    var first=D(c.r[0][0]); if(t<first) return ['soon','尚未開始'];
    var lastEnd=c.r[c.r.length-1][1];
    if(lastEnd && t>D(lastEnd)) return ['over','已結束'];
    return ['gap','空檔中・等下一段'];
  }
  function touches(c,y,m){
    var a=new Date(y,m,1), b=new Date(y,m+1,0);
    for(var i=0;i<c.r.length;i++){ var s=D(c.r[i][0]), e=c.r[i][1]?D(c.r[i][1]):null;
      if(s<=b && (!e||e>=a)) return true; } return false;
  }
  function render(){
    var y=cur.getFullYear(), m=cur.getMonth(), t=today();
    title.textContent=y+' 年 '+(m+1)+' 月';
    var list=CAL.filter(function(c){return touches(c,y,m) && (cat==='all'||c.cat==='both'||c.cat===cat);});
    var h='';
    ['日','一','二','三','四','五','六'].forEach(function(d,i){ h+='<div class="cal-dow'+(i===0||i===6?' we':'')+'">'+d+'</div>'; });
    var first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
    for(var i=0;i<42;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      if(i>=35 && d.getMonth()!==m) break;
      var out=d.getMonth()!==m, cls='cal-d'+(out?' out':'')+(d.getTime()===t.getTime()?' today':'')+(d<t?' past':'')+(d.getDay()===0||d.getDay()===6?' we':'');
      h+='<div class="'+cls+'" data-d="'+ymd(d)+'"><span class="n">'+d.getDate()+'</span>';
      list.forEach(function(c){
        var r=inRange(c,d), k='cal-lane';
        if(r){ k+=' on c-'+c.c; if(ymd(d)===r[0]) k+=' s'; if(r[1]&&ymd(d)===r[1]) k+=' e'; if(pick===c.k) k+=' pick'; }
        h+='<div class="'+k+'"></div>';
      });
      h+='</div>';
    }
    grid.innerHTML=h;
    if(!list.length){ leg.innerHTML='<li class="cal-empty" style="display:block">這個月沒有這一類的活動。</li>'; return; }
    leg.innerHTML=list.map(function(c){
      var st=status(c,t);
      var rg=c.r.map(function(x){ return '<u>'+md(x[0])+(x[1]?'–'+md(x[1]):' 起')+'</u>'; }).join('・');
      return '<li data-k="'+c.k+'" class="m-'+c.c+' '+(pick===c.k?'pick ':'')+(st[0]==='over'?'over':'')+'">'
        +'<span class="sw c-'+c.c+'"></span><span><b><span class="ct">'+CATN[c.cat]+'</span>'+c.n+'</b><span class="rg">'+rg+'</span>'
        +(c.s?'<span class="sb">'+c.s+'</span>':'')+'</span><span class="st '+st[0]+'">'+st[1]+'</span></li>';
    }).join('');
  }
  sec.addEventListener('click',function(e){
    var cb=e.target.closest('.cal-cat button');
    if(cb){ cat=cb.getAttribute('data-cat'); pick=null; document.body.classList.remove('cal-solo');
      Array.prototype.forEach.call(sec.querySelectorAll('.cal-cat button'),function(x){x.classList.toggle('on',x===cb);}); render(); return; }
    var b=e.target.closest('.cal-btn');
    if(b){ var n=+b.getAttribute('data-m');
      if(n===0){ var t=today(); cur=new Date(t.getFullYear(),t.getMonth(),1); }
      else cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);
      render(); return; }
    var li=e.target.closest('.cal-legend li[data-k]');
    if(li){ var k=li.getAttribute('data-k'); pick=(pick===k)?null:k;
      document.body.classList.toggle('cal-solo',!!pick); render(); }
  });
  var v=document.getElementById('views');
  if(v) v.addEventListener('click',function(e){
    var b=e.target.closest('button[data-v]'); if(!b) return;
    sec.hidden = b.getAttribute('data-v')!=='cal';
    if(!sec.hidden) render();
  });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && !sec.hidden) render(); });
  render();
})();
</script>
